name: API tests (Playwright)

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Include dev dependencies: test tooling needs security updates too.
      - run: npm run audit

  suite:
    name: Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright strips types without checking them, so check them separately.
      - run: npm run typecheck
      # API tests use request; no browser download required.
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/

  checks-on-the-tests:
    name: Checks on the tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:isolation
      - run: npm run test:guard
      - run: npm run test:repeat
      - run: npm run test:defects
      # The results page is generated, so it must match what the committed tests produce.
      # If this fails, run `npm run test:defects` and commit docs/defect-results.md.
      - run: git diff --exit-code docs/defect-results.md
